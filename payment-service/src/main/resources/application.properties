spring.application.name=payment-service
server.port=${PAYMENT_SERVICE_PORT}


spring.datasource.url=${PAYMENT_DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL}

eureka.instance.prefer-ip-address=true

# Stripe Configuration
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
kafka.topics.payment-successful=payment-successful-topic
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=payment-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# OpenFeign Configuration
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=5000
spring.cloud.openfeign.client.config.BOOKING-SERVICE.connect-timeout=5000
spring.cloud.openfeign.client.config.BOOKING-SERVICE.read-timeout=5000

# Resilience4j Circuit Breaker Configuration for BOOKING-SERVICE
resilience4j.circuitbreaker.instances.BOOKING-SERVICE.sliding-window-size=10
resilience4j.circuitbreaker.instances.BOOKING-SERVICE.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.BOOKING-SERVICE.wait-duration-in-open-state=10000ms
resilience4j.circuitbreaker.instances.BOOKING-SERVICE.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.BOOKING-SERVICE.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.timelimiter.instances.BOOKING-SERVICE.timeout-duration=5s

resilience4j.circuitbreaker.instances.booking-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.booking-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.booking-service.wait-duration-in-open-state=10000ms
resilience4j.circuitbreaker.instances.booking-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.booking-service.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.timelimiter.instances.booking-service.timeout-duration=5s