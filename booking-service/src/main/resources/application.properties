spring.application.name=booking-service
server.port=${BOOKING_SERVICE_PORT}


spring.datasource.url=${BOOKING_DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL}

eureka.instance.prefer-ip-address=true

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.database=1

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=booking-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# OpenFeign Configuration
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=5000
spring.cloud.openfeign.client.config.CATALOG-SERVICE.connect-timeout=5000
spring.cloud.openfeign.client.config.CATALOG-SERVICE.read-timeout=5000

# Resilience4j Circuit Breaker Configuration for CATALOG-SERVICE
resilience4j.circuitbreaker.instances.CATALOG-SERVICE.sliding-window-size=10
resilience4j.circuitbreaker.instances.CATALOG-SERVICE.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.CATALOG-SERVICE.wait-duration-in-open-state=10000ms
resilience4j.circuitbreaker.instances.CATALOG-SERVICE.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.CATALOG-SERVICE.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.timelimiter.instances.CATALOG-SERVICE.timeout-duration=5s

resilience4j.circuitbreaker.instances.catalog-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.catalog-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.catalog-service.wait-duration-in-open-state=10000ms
resilience4j.circuitbreaker.instances.catalog-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.catalog-service.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.timelimiter.instances.catalog-service.timeout-duration=5s