spring.application.name=api-gateway
server.port=${API_GATEWAY_PORT:8900}

# Eureka Client Configuration
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Redis Configuration (for reactive session checks)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.ssl.enabled=false

# JWT Secret
jwt.secret=${JWT_SECRET_KEY:${JWT_SECRET:asdkjf1343adsfjlajfyuhb45ndahbxm43dfsdsf}}

# Spring Cloud Gateway Routes
# 1. Public Auth Endpoints (No AuthFilter)
spring.cloud.gateway.routes[0].id=auth-service-public
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**

# 2. Protected Profile Endpoints (Requires AuthFilter)
spring.cloud.gateway.routes[1].id=auth-service-profile
spring.cloud.gateway.routes[1].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/profile/**
spring.cloud.gateway.routes[1].filters[0]=AuthFilter

# 3. Catalog Service Routes
spring.cloud.gateway.routes[2].id=catalog-service
spring.cloud.gateway.routes[2].uri=lb://CATALOG-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/catalog/**, /api/v1/venues/**, /api/v1/spaces/**, /api/v1/categories/**
spring.cloud.gateway.routes[2].filters[0]=AuthFilter

# 4. Booking Service Routes
spring.cloud.gateway.routes[3].id=booking-service
spring.cloud.gateway.routes[3].uri=lb://BOOKING-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/bookings/**
spring.cloud.gateway.routes[3].filters[0]=AuthFilter

# 5. Payment Service Routes
spring.cloud.gateway.routes[4].id=payment-service
spring.cloud.gateway.routes[4].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/payments/**
spring.cloud.gateway.routes[4].filters[0]=AuthFilter